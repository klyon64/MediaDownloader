name: Build MediaDownloader (Windows & macOS)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp customtkinter certifi pyinstaller

      - name: Install FFmpeg via winget
        run: winget install --id Gyan.FFmpeg -e --silent --accept-source-agreements --accept-package-agreements

      - name: Copy FFmpeg binaries to working folder
        shell: pwsh
        run: |
          $ffmpegPath = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty FullName
          $ffprobePath = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpegPath -or -not $ffprobePath) {
            $ffmpegPath = (Get-Command ffmpeg).Source
            $ffprobePath = (Get-Command ffprobe).Source
          }
          Copy-Item $ffmpegPath, $ffprobePath -Destination .

      - name: Build MediaDownloader.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "MediaDownloader" --collect-all customtkinter --collect-data certifi --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." downloader.py

      - name: Zip Windows executable
        shell: pwsh
        run: Compress-Archive -Path "dist\MediaDownloader.exe" -DestinationPath "MediaDownloader-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-Windows
          path: MediaDownloader-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          pip3 install yt-dlp customtkinter certifi pyinstaller

      - name: Install FFmpeg via Homebrew
        run: brew install ffmpeg

      - name: Build MediaDownloader.app
        run: |
          python3 -m PyInstaller --noconfirm --windowed --name "MediaDownloader" --collect-all customtkinter --collect-data certifi --add-binary "$(which ffmpeg):." --add-binary "$(which ffprobe):." downloader.py

      - name: Zip macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/MediaDownloader.app" "MediaDownloader-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-macOS
          path: MediaDownloader-macOS.zip

  release:
    needs: [build-windows, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaDownloader-Windows
          path: release_assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaDownloader-macOS
          path: release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MediaDownloader (Latest Build)
          body: |
            Автоматическая сборка приложения с встроенным FFmpeg.
            - **MediaDownloader-Windows.zip** — распакуйте и запустите `MediaDownloader.exe` (Windows).
            - **MediaDownloader-macOS.zip** — распакуйте и запустите `MediaDownloader.app` (macOS; при первом запуске откройте через правый клик -> «Открыть»).
          files: release_assets/*
          make_latest: true
